name: build nomoun lkm

on:
  workflow_call:
    inputs:
      build_all:
        description: Build all KMIs
        type: boolean
        default: false
      upstream_ref:
        description: Upstream branch, tag or SHA
        type: string
        default: master
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag or SHA
        type: string
        default: master
      kmi_android12_5_10:
        description: android12-5.10
        type: boolean
        default: false
      kmi_android13_5_10:
        description: android13-5.10
        type: boolean
        default: false
      kmi_android13_5_15:
        description: android13-5.15
        type: boolean
        default: false
      kmi_android14_5_15:
        description: android14-5.15
        type: boolean
        default: false
      kmi_android14_6_1:
        description: android14-6.1
        type: boolean
        default: false
      kmi_android15_6_6:
        description: android15-6.6
        type: boolean
        default: false
      kmi_android16_6_12:
        description: android16-6.12
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-lkm-nomount
  cancel-in-progress: false

env:
  UPSTREAM_REPO: maxsteeel/nomount
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
  RELEASE_REPO: AnyaKernel/Kernel-Release
  KEEP_RELEASES: 25

jobs:
  matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      kmi: ${{ steps.resolve.outputs.kmi }}
    steps:
      - id: resolve
        env:
          BUILD_ALL: ${{ inputs.build_all }}
          K_A12_510: ${{ inputs.kmi_android12_5_10 }}
          K_A13_510: ${{ inputs.kmi_android13_5_10 }}
          K_A13_515: ${{ inputs.kmi_android13_5_15 }}
          K_A14_515: ${{ inputs.kmi_android14_5_15 }}
          K_A14_61: ${{ inputs.kmi_android14_6_1 }}
          K_A15_66: ${{ inputs.kmi_android15_6_6 }}
          K_A16_612: ${{ inputs.kmi_android16_6_12 }}
        run: |
          set -euo pipefail

          all=(android12-5.10 android13-5.10 android13-5.15 android14-5.15
               android14-6.1 android15-6.6 android16-6.12)
          declare -A want=(
            [android12-5.10]="$K_A12_510"
            [android13-5.10]="$K_A13_510"
            [android13-5.15]="$K_A13_515"
            [android14-5.15]="$K_A14_515"
            [android14-6.1]="$K_A14_61"
            [android15-6.6]="$K_A15_66"
            [android16-6.12]="$K_A16_612"
          )

          sel=()
          for k in "${all[@]}"; do
            if [[ "$BUILD_ALL" == true || "${want[$k]}" == true ]]; then
              sel+=("$k")
            fi
          done
          (( ${#sel[@]} )) || sel=("${all[@]}")

          echo "kmi=$(printf '%s\n' "${sel[@]}" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.kmi }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON(needs.matrix.outputs.kmi) }}
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}
    env:
      SRC_DIR: ${{ github.workspace }}/kernel/src
      OUT: artifacts/nomount-${{ matrix.kmi }}.ko
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          fetch-depth: 0

      - name: Check toolchain
        run: |
          set -euo pipefail
          [[ -f "${KDIR:-}/Makefile" ]] || { echo "KDIR missing: ${KDIR:-<unset>}" >&2; exit 1; }
          command -v llvm-strip >/dev/null || { echo "llvm-strip missing" >&2; exit 1; }
          echo "kmi=${{ matrix.kmi }} kdir=$KDIR"
          clang --version | head -n1
          ld.lld --version

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          CONFIG_NOMOUNT=m make -j"$(nproc)" -C "$KDIR" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 M="$SRC_DIR" modules

      - name: Package
        run: |
          set -euo pipefail
          install -Dm644 "$SRC_DIR/nomount.ko" "$OUT"
          llvm-strip --strip-unneeded -R .BTF "$OUT"
          clang --version | head -n1 > "${OUT%.ko}.clang"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: nomount-${{ matrix.kmi }}
          path: |
            ${{ env.OUT }}
            artifacts/nomount-${{ matrix.kmi }}.clang
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    if: ${{ !cancelled() && contains(fromJSON('["success","failure"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Gather metadata and license files
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(out/*.ko)
          (( ${#files[@]} )) || { echo "no modules built" >&2; exit 1; }
          (cd out && sha256sum -- *.ko > SHA256SUMS)

          commit="$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_REF")"
          sha="$(jq -r .sha <<<"$commit")"
          short="${sha:0:7}"
          subject="$(jq -r '.commit.message | split("\n")[0]' <<<"$commit" | cut -c1-120)"
          author="$(jq -r '.commit.author.name' <<<"$commit")"

          compiler="unknown"
          clang_files=(out/*.clang)
          if (( ${#clang_files[@]} )); then
            compiler="$(head -qn1 "${clang_files[@]}" | sort -u | head -n1)"
          fi

          gh api "repos/$UPSTREAM_REPO/tarball/$sha" > "nomount-src-$short.tar.gz"
          gh api "repos/$UPSTREAM_REPO/contents/LICENSE" \
            -H "Accept: application/vnd.github.raw" > LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE || {
            echo "upstream LICENSE is not GPL, aborting" >&2; exit 1; }

          wf="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"
          wf="${wf%%@*}"
          script_url="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$wf"

          kmis="$(for f in "${files[@]}"; do b="${f##*/}"; b="${b#nomount-}"; echo "${b%.ko}"; done)"
          kmi_inline="$(paste -sd, <<<"$kmis" | sed 's/,/, /g')"

          tag="AnyaKernel-NoMount-LKM-${GITHUB_RUN_ID}"
          if (( GITHUB_RUN_ATTEMPT > 1 )); then tag+="-r${GITHUB_RUN_ATTEMPT}"; fi

          when="$(TZ=Asia/Jakarta date '+%d/%m/%Y %H:%M WIB')"

          if [[ "$UPSTREAM_REF" == master ]]; then
            prefix=""; pre=false; hashtag=""
          else
            prefix="[DEV] "; pre=true; hashtag=" #dev"
          fi
          title="${prefix}NoMount LKM | $short | $when"
          release_url="https://github.com/$RELEASE_REPO/releases/tag/$tag"

          cat > NOTICE.txt <<EOF
          NoMount LKM (unofficial build)

          Upstream project : $UPSTREAM_REPO
          Upstream URL     : https://github.com/$UPSTREAM_REPO
          Upstream commit  : $sha
          License          : GNU General Public License v3.0 (see LICENSE)

          These binaries are built from the unmodified upstream source at the
          commit above. Copyright remains with the upstream authors; their notices
          are preserved in the attached source archive.

          Corresponding source : nomount-src-$short.tar.gz (attached to this release)
          Build script         : $script_url

          Build command:
            CONFIG_NOMOUNT=m make -C \$KDIR ARCH=arm64 LLVM=1 LLVM_IAS=1 M=kernel/src modules
          Post-processing:
            llvm-strip --strip-unneeded -R .BTF

          This program is distributed in the hope that it will be useful, but
          WITHOUT ANY WARRANTY; see the GPL-3.0 text in LICENSE for details.
          EOF

          {
            echo "## ${prefix}NoMount LKM build from upstream"
            echo "> Built from [$UPSTREAM_REPO](https://github.com/$UPSTREAM_REPO). Unofficial build, unmodified source."
            echo
            printf '%s  \n' \
              "**Branch:** \`$UPSTREAM_REF\`" \
              "**Build date:** \`$when\`" \
              "**KMI:** $kmi_inline" \
              "**Latest commit:** [\`$short\`](https://github.com/$UPSTREAM_REPO/commit/$sha) $subject ($author)" \
              "**Compiler:** $compiler" \
              "**License:** GPL-3.0 (see \`LICENSE\`)" \
              "**Source:** \`nomount-src-$short.tar.gz\` attached, or [upstream](https://github.com/$UPSTREAM_REPO/tree/$sha)" \
              "**Build script:** [$wf]($script_url)"
            echo
            echo "---"
            echo
            echo "#Anyakernel #nomount #lkm #gki$hashtag"
          } > notes.md

          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          {
            echo "<b>${prefix}NoMount LKM</b>"
            echo
            echo "<b>Upstream:</b> <a href=\"https://github.com/$UPSTREAM_REPO/commit/$sha\">$UPSTREAM_REPO@$short</a>"
            echo "<b>Branch:</b> <code>$UPSTREAM_REF</code>"
            echo "<b>KMI:</b> $kmi_inline"
            echo "<b>Build date:</b> <code>$when</code>"
            echo "<b>Latest commit:</b> $(esc <<<"$subject ($author)")"
            echo "<b>Compiler:</b> $(esc <<<"$compiler")"
            echo
            echo "License: GPL-3.0. Source and license: <a href=\"$release_url\">release page</a>"
            echo
            echo "#Anyakernel #nomount #lkm$hashtag"
          } > caption.html

          {
            echo "tag=$tag"
            echo "short=$short"
            echo "title=$title"
            echo "pre=$pre"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRE: ${{ steps.meta.outputs.pre }}
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          assets=(out/*.ko out/SHA256SUMS "nomount-src-$SHORT.tar.gz" LICENSE NOTICE.txt)

          flags=()
          if [[ "$PRE" == true ]]; then flags+=(--prerelease); fi

          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$RELEASE_REPO"
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$RELEASE_REPO" \
              --title "$TITLE" \
              --notes-file notes.md \
              "${flags[@]}"
          fi

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$RELEASE_REPO" --limit 200 \
            --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"AnyaKernel-NoMount-LKM-\"))]
                  | sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r t; do
            gh release delete "$t" --repo "$RELEASE_REPO" --cleanup-tag --yes
          done

      - name: Telegram
        if: ${{ env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          api="https://api.telegram.org/bot${BOT_TOKEN}"
          files=(out/*.ko)
          caption="$(<caption.html)"

          if (( ${#files[@]} == 1 )); then
            resp="$(curl -sS "$api/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"${files[0]}" \
              -F parse_mode=HTML \
              -F caption="$caption")"
          else
            args=()
            for i in "${!files[@]}"; do
              args+=(-F "f$i=@${files[$i]}")
            done
            media="$(jq -nc --arg cap "$caption" --argjson n "${#files[@]}" '
              [range($n) | {type: "document", media: "attach://f\(.)"}]
              | .[-1] += {caption: $cap, parse_mode: "HTML"}')"
            resp="$(curl -sS "$api/sendMediaGroup" \
              -F chat_id="$CHAT_ID" \
              -F media="$media" \
              "${args[@]}")"
          fi

          jq -e '.ok' <<<"$resp" >/dev/null || {
            echo "telegram: $(jq -r '.description // "unknown error"' <<<"$resp")" >&2
            exit 1
          }
